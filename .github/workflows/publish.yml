# Publishes the package to npm when a version tag (for example 0.1.1) is pushed.
# n8n requires community nodes to be published from GitHub Actions with provenance (since May 1, 2026).
#
# Security:
# - Two jobs. "build" runs the dev toolchain (lint, tsc) with read-only permissions and no OIDC token,
#   and packs the tarball. "publish" has the OIDC permission but no checkout and no node_modules:
#   it only verifies the tarball's SHA-256 and publishes it, so no dependency code runs there.
# - Trusted Publishing (OIDC) only: no npm token is stored in this repository.
#   npmjs.com -> package -> Settings -> Trusted Publisher: GitHub Actions,
#   repository sanivan/n8n-nodes-screenshot-com-ar, workflow publish.yml, environment npm.
# - The "publish" job runs in the "npm" environment, which requires a manual approval and only
#   accepts version tags (Settings -> Environments -> npm). Check the file list and SHA-256 in the
#   summary before approving; the publish job re-checks the tarball itself before publishing.
# - The tag must match the version in package.json and point to a commit on main.
# - Actions are pinned by commit SHA; dependencies are installed without install scripts.

name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - id: check
        name: Tag must match package.json and be on main
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit is not on main" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - run: npm run lint

      - run: npm run build

      - id: pack
        name: Pack
        run: |
          FILE="n8n-nodes-screenshot-com-ar-$GITHUB_REF_NAME.tgz"
          npm pack --ignore-scripts
          {
            echo '### Package contents'
            echo '```'
            tar -tzf "$FILE"
            echo '```'
            echo "SHA-256: \`$(sha256sum "$FILE" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sha256=$(sha256sum "$FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: n8n-nodes-screenshot-com-ar-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write # npm Trusted Publishing and provenance; this job has no checkout and no node_modules
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # npm >= 11.5.1 is needed for Trusted Publishing
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Verify the tarball (without trusting the build job) and publish with provenance
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          FILE="n8n-nodes-screenshot-com-ar-${GITHUB_REF_NAME}.tgz"
          echo "${SHA256}  ${FILE}" | sha256sum --check --strict
          {
            echo '### Package to publish'
            echo '```'
            tar -tzf "$FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Only the expected files
          if tar -tzf "$FILE" | grep -vE '^package/(dist/.+|README\.md|LICENSE\.md|package\.json)$'; then
            echo "Unexpected files in the package" >&2
            exit 1
          fi
          # Right name and version, no dependencies and no install scripts
          tar -xzOf "$FILE" package/package.json | node -e '
            const p = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const s = p.scripts || {};
            const bad = p.name !== "n8n-nodes-screenshot-com-ar" || p.version !== process.env.GITHUB_REF_NAME
              || ["preinstall", "install", "postinstall", "prepare"].some((k) => s[k])
              || Object.keys(p.dependencies || {}).length > 0;
            if (bad) { console.error("package.json in the tarball failed the checks"); process.exit(1); }'
          npm publish "./${FILE}" --provenance --access public --ignore-scripts
